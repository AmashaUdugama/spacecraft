name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies (skip TensorFlow for CI speed)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          # Install everything except tensorflow - tests use the heuristic
          # fallback path, so the real CNN weights aren't needed to verify
          # the API/logic layer. This keeps CI fast (~1 min instead of ~10).
          grep -v "^tensorflow" requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Create .env
        working-directory: backend
        run: cp .env.example .env

      - name: Train the comfort model (fast, needed for tests)
        working-directory: backend
        run: python -m app.ml.training.train_comfort_model

      - name: Run tests
        working-directory: backend
        run: python -m pytest tests/ -v

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build